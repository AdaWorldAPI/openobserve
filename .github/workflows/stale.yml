name: Close stale PRs
permissions:
  contents: read
  pull-requests: write
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-message: "This PR has been inactive for 14 days. Please update or we will close it soon."
          days-before-stale: 14
          days-before-close: 7
          close-pr-message: "Closing PR due to inactivity. Feel free to reopen if needed."
          stale-pr-label: "stale"
          exempt-pr-labels: "keep-open,important"
          only-labels: ""
