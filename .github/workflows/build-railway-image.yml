name: Build Railway image

# Railway stops image builds at 90 minutes and this build needs longer, so the image is built
# here and Railway deploys ghcr.io/adaworldapi/openobserve:latest.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # A change that cannot alter the image must not restart a 60-90 minute build.
    paths-ignore:
      - "tests/**"
      - "docs/**"
      - "**.md"
      - ".github/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read
  packages: write

# A running build is never cancelled: a newer push waits, and only the newest waiting one is kept.
concurrency:
  group: build-railway-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/build/Dockerfile.railway
          push: true
          tags: |
            ghcr.io/adaworldapi/openobserve:latest
            ghcr.io/adaworldapi/openobserve:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
