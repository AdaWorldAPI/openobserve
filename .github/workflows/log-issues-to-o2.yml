name: GitHub Issues → OpenObserve

# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send GitHub event to OpenObserve
        env:
          GITHUB_EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          curl -X POST "${{ secrets.OO_CLOUD_INGEST_URL }}" \
            -H "Authorization: Basic ${{ secrets.OO_CLOUD_AUTH }}" \
            -H "Content-Type: application/json" \
            -d "$GITHUB_EVENT_JSON"

